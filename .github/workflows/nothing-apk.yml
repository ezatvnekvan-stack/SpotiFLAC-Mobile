name: Nothing edition APK

on:
  push:
    branches: [codex/nothing-redesign]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nothing-apk.yml'
      - 'lib/**'
      - 'test/nothing_design_test.dart'
      - 'assets/fonts/NothingDot.ttf'

permissions:
  contents: read

concurrency:
  group: nothing-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validate and build Phone (3a) APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPOTIFLAC_RUST_ANDROID_ABIS: arm64-v8a
      SPOTIFLAC_DISCORD_SDK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '9.8.1'
      - name: Install native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev ffmpeg
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;30.0.16248370' 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;4.1.2'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          cd rust_backend
          rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: nothing-arm64-${{ runner.os }}-${{ hashFiles('rust_backend/rust-toolchain.toml', 'rust_backend/Cargo.lock') }}
      - name: Check optional Discord SDK availability
        id: discord
        env:
          SDK_PASSPHRASE: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}
        run: |
          if [[ -n "$SDK_PASSPHRASE" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Discord SDK when configured
        if: steps.discord.outputs.available == 'true'
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}
      - name: Resolve dependencies and format changed sources
        run: |
          flutter pub get
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.dart' | xargs -r dart format
      - name: Analyze app
        run: flutter analyze
      - name: Run design and persistence regression checks
        run: flutter test test/nothing_design_test.dart test/design_system_test.dart test/theme_provider_persistence_test.dart
      - name: Build and audit ARM64 release
        run: |
          if [[ "$SPOTIFLAC_DISCORD_SDK" == '1' ]]; then
            bash scripts/build_android.sh --production
          else
            bash scripts/build_android.sh --lite
          fi
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          mkdir -p build/nothing-delivery
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/nothing-delivery/SpotiFLAC-Nothing-Phone3a.apk
          git rev-parse HEAD > build/nothing-delivery/COMMIT.txt
          git diff -- '*.dart' > build/nothing-delivery/formatted-source.patch
          sha256sum build/nothing-delivery/*.apk > build/nothing-delivery/SHA256.txt
          echo 'Custom Nothing-inspired edition. Test signed; requires uninstalling an app signed with another key. Back up app data first.' > build/nothing-delivery/BUILD-NOTES.txt
          if [[ "$SPOTIFLAC_DISCORD_SDK" != '1' ]]; then
            echo 'Discord presence SDK was unavailable. This build retains playback, downloads and library functions; Discord presence is unavailable.' >> build/nothing-delivery/BUILD-NOTES.txt
          fi
      - name: Retain APK and source changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SpotiFLAC-Nothing-Phone3a
          path: build/nothing-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Retain matching crash symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Nothing-Android-symbols
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
